# @NAME@, another app on this Pi, served over https on its behalf and passed
# through to it on port @PORT@. nginx/https.sh writes one of these for each of
# OTHER_SITES once the certs service has that name's certificate.
server {
    listen 443 ssl;
    http2 on;
    server_name @NAME@;
    ssl_certificate /certs/certificates/@NAME@.crt;
    ssl_certificate_key /certs/certificates/@NAME@.key;
    location / {
        proxy_pass http://host.docker.internal:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Live cards should arrive as soon as they are sent, not when a buffer fills.
        proxy_buffering off;
    }
}
