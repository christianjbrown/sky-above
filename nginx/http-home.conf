# Another app on this Pi, on port @PORT@, shown on HTTP_PORT in place of the card for anything
# that is not a name with a certificate, such as the Pi's own address: a page of links to
# everything on the Pi, say. nginx/https.sh writes this into conf.d when HOME_PORT is set.
server {
    listen 81 default_server;
    location / {
        proxy_pass http://host.docker.internal:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
