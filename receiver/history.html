<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky Above history</title>
  <meta name="description" content="Every plane Sky Above has shown, with the famous owners picked out.">
  <meta name="theme-color" content="#0b1a33">
  <link rel="stylesheet" href="pages.css">
</head>
<body>
  <main>
    <nav><a href="/">Card</a><a href="/history" aria-current="page">History</a><a href="/flights">Flights</a></nav>
    <p class="eyebrow">Sky Above</p>
    <h1>What flew over</h1>
    <p>Every plane that has had the card, newest first. Reload for the latest.</p>
    <p id="history-status" class="status">Reading the history&hellip;</p>

    <form class="filters" id="filters">
      <label class="chip"><input type="checkbox" name="kind" value="airline" checked><span>Airlines<span class="count" data-count="airline"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="military" checked><span>Military<span class="count" data-count="military"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="police" checked><span>Police<span class="count" data-count="police"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="ambulance" checked><span>Air ambulance<span class="count" data-count="ambulance"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="private-helicopter" checked><span>Private helicopters<span class="count" data-count="private-helicopter"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="private-plane" checked><span>Private planes<span class="count" data-count="private-plane"></span></span></label>
      <label class="chip"><input type="checkbox" name="famous"><span>🌟 Famous only<span class="count" data-count="famous"></span></span></label>
      <label class="chip"><input type="checkbox" name="emergency"><span>🚨 Emergencies only<span class="count" data-count="emergency"></span></span></label>
      <input class="search" type="search" name="search" placeholder="Flight, owner, aircraft, place" aria-label="Search">
      <div class="filters airlines" id="airlines" aria-label="Airlines"></div>
    </form>

    <p id="history-summary"></p>
    <div class="scroll">
      <table>
        <thead><tr><th>When</th><th>Kind</th><th>Flight</th><th>Airline or operator</th><th>Route</th><th>Aircraft</th><th>Closest</th><th>Belongs to</th></tr></thead>
        <tbody id="shown"></tbody>
      </table>
    </div>
  </main>
  <script src="pages.js"></script>
  <script src="history.js"></script>
</body>
</html>
