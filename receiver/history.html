<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sky Above history</title>
  <meta name="description" content="Every plane Sky Above has shown, with the famous owners picked out.">
  <meta name="theme-color" content="#0b1a33">
  <style>
    :root {
      --sky-top: #0b1a33;
      --sky-bottom: #10284d;
      --text: #f4f7fb;
      --muted: #9fb3cf;
      --accent: #ffb347;
      --panel: rgba(255, 255, 255, 0.06);
      --line: rgba(255, 255, 255, 0.12);
      --ambulance: #3ddc84;
      --police: #6aa8ff;
      --military: #c2cc7a;
      color-scheme: dark;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 2rem 1rem;
      box-sizing: border-box;
      background: linear-gradient(var(--sky-top), var(--sky-bottom)) fixed;
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 80rem; margin: 0 auto; }
    .eyebrow { color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; font-size: 0.8rem; margin: 0; }
    h1 { margin: 0.2rem 0 0.4rem; font-size: 1.8rem; }
    p { color: var(--muted); margin: 0.3rem 0; }
    #history-status { color: var(--accent); }

    .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 1.4rem 0 0.8rem; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .chip span {
      display: inline-block;
      padding: 0.35rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      user-select: none;
    }
    .chip input:checked + span { color: var(--text); background: var(--panel); border-color: var(--accent); }
    .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chip .count { color: var(--muted); margin-left: 0.3rem; font-variant-numeric: tabular-nums; }
    .search {
      flex: 1 1 14rem;
      min-width: 0;
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    .search::placeholder { color: var(--muted); }
    .airlines { flex-basis: 100%; margin: 0.2rem 0 0; font-size: 0.85rem; }
    .airlines:empty { display: none; }

    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 0.5rem 0.9rem 0.5rem 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    .kind { font-size: 0.8rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: var(--panel); color: var(--muted); }
    .kind-military { color: var(--military); }
    .kind-police { color: var(--police); }
    .kind-ambulance { color: var(--ambulance); }
    .famous { color: var(--accent); }
    .famous small { color: var(--muted); margin-left: 0.4rem; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Sky Above</p>
    <h1>What flew over</h1>
    <p>Every plane that has had the card, newest first. Reload for the latest.</p>
    <p id="history-status">Reading the history&hellip;</p>

    <form class="filters" id="filters">
      <label class="chip"><input type="checkbox" name="kind" value="airline" checked><span>Airlines<span class="count" data-count="airline"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="military" checked><span>Military<span class="count" data-count="military"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="police" checked><span>Police<span class="count" data-count="police"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="ambulance" checked><span>Air ambulance<span class="count" data-count="ambulance"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="private-helicopter" checked><span>Private helicopters<span class="count" data-count="private-helicopter"></span></span></label>
      <label class="chip"><input type="checkbox" name="kind" value="private-plane" checked><span>Private planes<span class="count" data-count="private-plane"></span></span></label>
      <label class="chip"><input type="checkbox" name="famous"><span>🌟 Famous only<span class="count" data-count="famous"></span></span></label>
      <input class="search" type="search" name="search" placeholder="Flight, owner, aircraft, place" aria-label="Search">
      <div class="filters airlines" id="airlines" aria-label="Airlines"></div>
    </form>

    <p id="history-summary"></p>
    <div class="scroll">
      <table>
        <thead><tr><th>When</th><th>Kind</th><th>Flight</th><th>Airline or operator</th><th>Route</th><th>Aircraft</th><th>Closest</th><th>Belongs to</th></tr></thead>
        <tbody id="shown"></tbody>
      </table>
    </div>
  </main>
  <script src="history.js"></script>
</body>
</html>
